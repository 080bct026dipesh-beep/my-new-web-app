name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ktm_bus
          POSTGRES_PASSWORD: ktm_bus_dev
          POSTGRES_DB: ktm_bus_route_finder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ADMIN_API_KEY: ci-test-admin-key
      JWT_SECRET_KEY: ci-test-jwt-secret
      DATABASE_URL: postgresql://ktm_bus:ktm_bus_dev@localhost:5432/ktm_bus_route_finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Load sample dataset (data/processed/*_clean.csv)
        # Several tests assert against real stop/route IDs from the
        # shipped dataset (see their docstrings: "...and sample data
        # imported"), not just a migrated-but-empty schema -- e.g.
        # test_route_finder_api.py's S0072->S0326 case and
        # test_admin_route_status.py's R2295986. Runs from the repo
        # root since import_data.py resolves paths relative to it.
        working-directory: .
        run: python data/scripts/import_data.py
      - run: pytest

  data-pipeline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # scipy>=1.18 (scripts/requirements.txt) requires Python >=3.12
          # -- this used to be pinned to 3.11, which predates that pin.
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt pytest
      - name: Run clean_data.py regression tests
        working-directory: data/scripts
        run: pytest test_clean_data.py
      - name: Run the cleaning pipeline against committed raw data
        run: python scripts/clean_data.py --raw-dir raw --out-dir processed --fail-on-verify-error
      - name: Validate the resulting processed/ output
        run: python scripts/validate_clean.py --dir processed

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (test dependency) pulls in undici, which requires
          # Node >=22.14 or >=24 -- this used to be pinned to 20, which
          # predates that jsdom bump.
          node-version: "22"
      - name: Install, lint, test, and build
        run: |
          if [ -f package.json ]; then
            npm install
            npm run lint
            npm test
            npm run build
          else
            echo "Frontend not yet scaffolded — skipping."
          fi
